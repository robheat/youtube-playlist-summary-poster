name: Process YouTube Playlists

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without publishing or saving state"
        type: boolean
        default: false
  schedule:
    # Daily at 13:00 UTC -- adjust to match how often videos get added.
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  process:
    strategy:
      fail-fast: false
      # Serializes the two legs. Each leg pushes to a DIFFERENT site repo
      # (no race there), but both commit back to THIS repo's own state
      # file afterward -- different files, same branch. Running them in
      # parallel risks the second leg's state-file push getting rejected,
      # which git-auto-commit-action doesn't retry. Serializing avoids
      # that race entirely; doubling wall-clock time costs nothing here.
      max-parallel: 1
      matrix:
        target_site: [cryptocatalyst-news, ainformed-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: process-playlist-${{ matrix.target_site }}
      cancel-in-progress: false
    steps:
      # ref: github.ref (not the default github.sha) so each matrix leg's
      # checkout resolves the branch fresh at ITS OWN checkout time. With
      # the default, actions/checkout@v4 checks out github.sha, which is
      # fixed once for the whole workflow run -- so even with max-parallel:
      # 1 correctly serializing the two legs (no time overlap), the SECOND
      # leg still checked out the PRE-RUN commit and missed the first
      # leg's own state-file push moments earlier, causing its own
      # state-file push to be rejected as non-fast-forward. Confirmed via
      # a real failed run: the two jobs had zero time overlap, yet still
      # diverged.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run summarizer
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TARGET_SITE: ${{ matrix.target_site }}
          SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          VENICE_AI_API_KEY: ${{ secrets.VENICE_AI_API_KEY }}
          VENICE_MODEL: ${{ vars.VENICE_MODEL }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          SITE_REPO_PAT: ${{ secrets.SITE_REPO_PAT }}
          MAX_VIDEOS_PER_RUN: ${{ vars.MAX_VIDEOS_PER_RUN }}
        run: python -m app.main ${{ (github.event.inputs.dry_run == 'true') && '--dry-run' || '' }}

      - name: Commit updated state
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update processed videos state (${{ matrix.target_site }}) [skip ci]"
          file_pattern: "data/processed_videos_${{ matrix.target_site }}.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
